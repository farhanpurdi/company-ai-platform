# Local profile: mock upstream instead of OpenAI, Caddy internal TLS bound to
# 127.0.0.1 only.

services:
  mock-upstream:
    image: llm-gateway-mock-upstream
    build: ../mock_upstream
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro

  tools:
    env_file:
      - path: env/local.env
        required: false
    environment:
      GATEWAY_CA_BUNDLE: /caddy-data/caddy/pki/authorities/local/root.crt
      MOCK_URL: http://mock-upstream:8080
    volumes:
      - caddy-data:/caddy-data:ro
